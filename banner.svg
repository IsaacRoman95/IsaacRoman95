<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#132A4A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>
  <circle cx="1080" cy="40" r="180" fill="#6366F1" fill-opacity="0.10"/>
  <circle cx="980" cy="260" r="120" fill="#38BDF8" fill-opacity="0.08"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="92" fill="#94A3B8" font-size="18" letter-spacing="4">INGENIERO DE SISTEMAS</text>
    <text x="72" y="150" fill="#F8FAFC" font-size="52" font-weight="700">Samuel Isaac Román</text>
    <rect x="72" y="172" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="216" fill="#CBD5E1" font-size="24">Desarrollador Full-Stack  ·  Web, móvil y machine learning</text>
  </g>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" fill="#7DD3FC" fill-opacity="0.85">
    <text x="860" y="118">const stack = [</text>
    <text x="884" y="144">"TypeScript", "PHP",</text>
    <text x="884" y="170">"Laravel", "Node.js",</text>
    <text x="884" y="196">"React", "Vue", "Python"</text>
    <text x="860" y="222">];</text>
  </g>
</svg>
